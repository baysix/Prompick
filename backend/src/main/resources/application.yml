spring:
  application:
    name: prompick-api

  # .env 파일을 설정으로 읽어 들인다. 파일이 없어도(운영 환경 등) 그냥 넘어간다.
  # 같은 이름의 진짜 환경변수가 있으면 그쪽이 우선한다.
  config:
    import: optional:file:.env[.properties]

  # 애플리케이션 쿼리용. Supabase에서는 Supavisor 트랜잭션 모드(6543)를 쓴다.
  datasource:
    url: ${DB_POOL_URL:jdbc:postgresql://localhost:5432/prompick}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      # 풀러를 거치므로 앱 쪽 커넥션은 적게 유지한다.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      data-source-properties:
        # 트랜잭션 풀링 모드에서는 서버 사이드 prepared statement를 쓸 수 없다.
        # 이걸 켜두면 "prepared statement S_1 already exists" 오류가 난다.
        prepareThreshold: 0

  jpa:
    # 스키마의 주인은 Flyway다. JPA는 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  # 마이그레이션은 세션 연결(5432)로 따로 붙는다.
  # 트랜잭션 풀러로 DDL·advisory lock을 쓰면 마이그레이션이 깨진다.
  flyway:
    enabled: true
    url: ${DB_SESSION_URL:jdbc:postgresql://localhost:5432/prompick}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Supabase의 시스템 스키마는 건드리지 않는다.
    schemas: public

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: alpha
  api-docs:
    path: /api-docs

logging:
  level:
    com.prompick: DEBUG
    org.hibernate.SQL: DEBUG

# ---------------------------------------------------------------------------
# 프롬픽 운영 설정
# PRD 15장 미결정 항목. 기본값으로 두되 언제든 바꿀 수 있게 설정으로 분리한다.
# 운영 중 변경이 필요한 값은 이후 app_settings 테이블이 이 값을 덮어쓴다.
# ---------------------------------------------------------------------------
prompick:
  # 재화 단위: 프롬비
  credit:
    unit-name: 프롬비
    signup-bonus: 0
    # 유료 템플릿 기본 가격. 템플릿마다 관리자가 개별 조정한다.
    default-prompt-cost: 100
    default-generate-cost: 100

  free:
    # 계정당 하루 무료 자동 제작 횟수 (KST 자정 초기화)
    daily-generate-limit: ${FREE_DAILY_LIMIT:3}
    # 무료 결과물 워터마크 적용 여부
    watermark: true
    # 무료 제작에 휴대폰 본인인증을 요구할지
    require-identity-verification: ${FREE_REQUIRE_IDENTITY:true}

  output:
    # 결과물 보관 기간(일). 만료 후 파일 삭제
    retention-days: 30

  upload:
    max-size-mb: 10
    allowed-mime-types: image/jpeg,image/png,image/webp

  storage:
    # LOCAL: 로컬 디스크(오프라인 개발용) / SUPABASE: Supabase Storage
    type: ${STORAGE_TYPE:SUPABASE}
    local:
      base-path: ${STORAGE_LOCAL_PATH:./storage}
      # 로컬에서 서명 URL을 흉내 낼 때 사용할 공개 주소
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
    # 다운로드 서명 URL 만료(초)
    signed-url-ttl-seconds: 300

  ai:
    # 제공사 키를 DB에 봉인할 때 쓰는 열쇠. base64로 인코딩한 32바이트.
    # 이 값이 바뀌면 이미 저장된 키를 못 읽는다. 백업해 두고 함부로 바꾸지 않는다.
    master-key: ${PROMPICK_MASTER_KEY:}

    # 관리자 화면에 키를 넣기 전까지 쓰는 대비책. 화면에 넣은 값이 항상 우선한다.
    keys:
      OPENAI: ${OPENAI_API_KEY:}
      ANTHROPIC: ${ANTHROPIC_API_KEY:}
      GOOGLE: ${GOOGLE_API_KEY:}
      XAI: ${XAI_API_KEY:}
      BYTEDANCE: ${BYTEDANCE_API_KEY:}
      HIGGSFIELD: ${HIGGSFIELD_API_KEY:}
      RUNWAY: ${RUNWAY_API_KEY:}
      KLING: ${KLING_API_KEY:}

    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      # 이미지 한 장에 1~3분까지 걸린다. 파이프라인 단계 제한(5분)보다 짧게 잡는다.
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:240}

  supabase:
    url: ${SUPABASE_URL:}
    # 서버 전용 키 (sb_secret_...). RLS를 우회하므로 절대 프론트엔드로 내보내지 않는다.
    secret-key: ${SUPABASE_SECRET_KEY:}
    # 예전 방식(HS256 대칭키) 프로젝트만 채운다.
    # 비워두면 JWKS(비대칭키)로 검증한다. 최근 생성한 프로젝트는 비워두면 된다.
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    storage:
      # 업로드 원본 (사용자가 올린 사진). 비공개 버킷
      upload-bucket: ${SUPABASE_UPLOAD_BUCKET:uploads}
      # 생성 결과물. 비공개 버킷, 서명 URL로만 접근
      output-bucket: ${SUPABASE_OUTPUT_BUCKET:outputs}
      # 템플릿 예시·가이드 이미지. 공개 버킷 (검색 노출·OG 이미지에 필요)
      public-bucket: ${SUPABASE_PUBLIC_BUCKET:public-assets}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # 제작 워커
  worker:
    # 대기 중인 작업을 확인하는 주기(ms)
    poll-ms: 3000
    # 오래 멈춰 있는 작업을 정리하는 주기(ms)
    timeout-sweep-ms: 60000

  # 개발용 가짜 AI. 실제 API는 호출마다 비용이 들어 개발 중에는 이것으로 돌린다.
  mock:
    # 한 단계가 끝나는 데 걸리는 시간(초)
    step-seconds: ${MOCK_STEP_SECONDS:4}
    # 실패를 흉내 낼 확률. 실패 시 환불이 도는지 확인할 때 올린다
    failure-rate: ${MOCK_FAILURE_RATE:0.0}
