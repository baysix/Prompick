# =============================================================================
# 푸시한 것이 실제로 도는지 확인한다
#
# 배포는 하지 않는다. 여기서 하는 일은 "서버에 올렸을 때 깨질 것을 미리 걸러내는 것"
# 하나뿐이다. 배포는 사람이 배포 잠금을 걸고 직접 한다 (docs/06-서버-운영.md).
#
# 자동 배포를 붙이지 않은 이유가 있다. 푸시할 때마다 서버가 다시 뜨면 그때 제작 중이던
# 작업이 끊기고, 10분 뒤 다른 워커가 처음 단계부터 다시 돌린다 - 이미 낸 AI 요금을 한 번
# 더 내는 셈이다.
# =============================================================================

name: 검증

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞엣것은 멈춘다. 어차피 볼 것은 마지막 결과다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 백엔드: 컴파일 + 테스트 + 마이그레이션
  #
  # 진짜 PostgreSQL 을 띄우고 그 위에서 돌린다. 테스트가 @SpringBootTest 라 DB 없이는
  # 아예 뜨지 않기도 하지만, 그보다 Flyway 가 V1 부터 끝까지 한 번 훑는 것이 크다.
  # 마이그레이션이 깨진 것은 운영 DB 에 적용되고 나서야 알게 되면 되돌릴 수 없다.
  # ---------------------------------------------------------------------------
  backend:
    name: 백엔드
    runs-on: ubuntu-24.04

    services:
      postgres:
        # 운영(Supabase)이 17 이다. 버전을 맞춰야 여기서 통과한 것이 저기서도 통과한다.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prompick
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: backend/*.gradle*

      - name: 빌드와 테스트
        working-directory: backend
        run: chmod +x gradlew && ./gradlew build --no-daemon
        env:
          # 로컬 PostgreSQL 이라 풀러가 없다. 두 주소가 같아도 된다.
          DB_POOL_URL: jdbc:postgresql://localhost:5432/prompick
          DB_SESSION_URL: jdbc:postgresql://localhost:5432/prompick
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          # Supabase 를 부르지 않는다. 키도 없고, 부를 이유도 없다.
          STORAGE_TYPE: LOCAL

      # 실패했을 때 무엇이 왜 깨졌는지 로그에 바로 찍는다.
      #
      # 보고서를 아티팩트로만 남기면 zip 을 받아 열어봐야 알 수 있는데, 대개는 실패한
      # 테스트 이름과 예외 몇 줄이면 충분하다. 그 몇 줄을 보려고 내려받게 하지 않는다.
      - name: 실패 원인 찍기
        if: failure()
        working-directory: backend
        run: |
          echo "::group::실패한 테스트"
          grep -rl -e "<failure" -e "<error" build/test-results/test/ 2>/dev/null | while read -r f; do
            echo "--- $f"
            head -c 4000 "$f"
            echo
          done
          echo "::endgroup::"

      - name: 테스트 보고서 남기기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: 테스트-보고서
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          retention-days: 7
